<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Agregar Revendedor</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/styles.css') }}">

</head>

<body>

<div class="dashboard-wrapper">

    {% include 'components/header.html' %}

    <main class="content">

        <div class="page-header">

            <h1>
                Registrar Revendedor
            </h1>

            <p>
                Ingreso de nuevos revendedores para distribución.
            </p>

        </div>

        <form method="POST">

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Nombre
                    </label>

                    <input type="text"
                           name="nombre"
                           required>

                </div>


                <div class="form-group">

                    <label>
                        Teléfono
                    </label>

                    <input type="text"
                           name="telefono">

                </div>


                <div class="form-group">

                    <label>
                        Dirección
                    </label>

                    <input type="text"
                           name="direccion"
                           required>

                </div>


                <div class="form-group">

                    <label>
                        Zona
                    </label>

                    <input type="text"
                           name="zona">

                </div>


                <div class="form-group">

                    <label>
                        Latitud
                    </label>

                    <input type="number"
                           step="0.00000001"
                           name="latitud">

                </div>


                <div class="form-group">

                    <label>
                        Longitud
                    </label>

                    <input type="number"
                           step="0.00000001"
                           name="longitud">

                </div>


                <div class="form-group">

                    <label>
                        Usuario Responsable
                    </label>

                    <select name="id_usuario"
                            required>

                        <option value="">
                            Seleccione un usuario
                        </option>

                        {% for usuario in usuarios %}

                        <option value="{{ usuario.id_usuario }}">

                            {{ usuario.nombre }}
                            ({{ usuario.usuario }})

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Estado
                    </label>

                    <select name="estado">

                        <option value="1">

                            Activo

                        </option>

                        <option value="0">

                            Inactivo

                        </option>

                    </select>

                </div>

            </div>


            <div class="buttons">

                <button type="submit"
                        class="btn btn-success">

                    Guardar

                </button>


                <a href="{{ url_for(
                    'revendedores.listar_revendedores'
                ) }}"
                   class="btn btn-danger">

                    Cancelar

                </a>

            </div>

        </form>

    </main>

</div>

</body>
</html>
