<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Editar Revendedor</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/styles.css') }}">

</head>

<body>

<div class="dashboard-wrapper">

    {% include 'components/header.html' %}

    <main class="content">

        <div class="page-header">

            <h1>
                Modificar Revendedor
            </h1>

            <p>
                Actualización de información del revendedor.
            </p>

        </div>

        <form method="POST">

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Nombre
                    </label>

                    <input type="text"
                           name="nombre"
                           value="{{ revendedor.nombre }}"
                           required>

                </div>


                <div class="form-group">

                    <label>
                        Teléfono
                    </label>

                    <input type="text"
                           name="telefono"
                           value="{{ revendedor.telefono or '' }}">

                </div>


                <div class="form-group">

                    <label>
                        Dirección
                    </label>

                    <input type="text"
                           name="direccion"
                           value="{{ revendedor.direccion }}"
                           required>

                </div>


                <div class="form-group">

                    <label>
                        Zona
                    </label>

                    <input type="text"
                           name="zona"
                           value="{{ revendedor.zona or '' }}">

                </div>


                <div class="form-group">

                    <label>
                        Latitud
                    </label>

                    <input type="number"
                           step="0.00000001"
                           name="latitud"
                           value="{{ revendedor.latitud or '' }}">

                </div>


                <div class="form-group">

                    <label>
                        Longitud
                    </label>

                    <input type="number"
                           step="0.00000001"
                           name="longitud"
                           value="{{ revendedor.longitud or '' }}">

                </div>


                <div class="form-group">

                    <label>
                        Usuario responsable
                    </label>

                    <select name="id_usuario"
                            required>

                        {% for usuario in usuarios %}

                        <option value="{{ usuario.id_usuario }}"
                            {% if usuario.id_usuario == revendedor.id_usuario %}
                                selected
                            {% endif %}>

                            {{ usuario.nombre }}
                            ({{ usuario.usuario }})

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Estado
                    </label>

                    <select name="estado">

                        <option value="1"
                            {% if revendedor.estado %}
                                selected
                            {% endif %}>

                            Activo

                        </option>

                        <option value="0"
                            {% if not revendedor.estado %}
                                selected
                            {% endif %}>

                            Inactivo

                        </option>

                    </select>

                </div>

            </div>


            <div class="buttons">

                <button type="submit"
                        class="btn btn-success">

                    Guardar

                </button>


                <a href="{{ url_for(
                    'revendedores.listar_revendedores'
                ) }}"
                   class="btn btn-danger">

                    Cancelar

                </a>

            </div>

        </form>

    </main>

</div>

</body>
</html>
