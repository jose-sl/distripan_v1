<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Gestión de Rutas
    </title>

    <link rel="stylesheet"
          href="{{ url_for(
              'static',
              filename='css/styles.css'
          ) }}">

</head>

<body>

<div class="dashboard-wrapper">

    {% include 'components/header.html' %}

    <main class="content">

        <!-- =================================
             ENCABEZADO
        ================================== -->

        <div class="page-header">

            <h1>
                Gestión de Rutas
            </h1>

            <p>
                Planificación y seguimiento
                de las rutas de distribución.
            </p>

        </div>


        <!-- =================================
             BOTONES
        ================================== -->

        <div class="toolbar">

            {% if mostrar_iniciar %}

                <a href="{{ url_for(
                    'rutas.iniciar_ruta'
                ) }}"
                   class="btn btn-success"
                   onclick="
                       return confirm(
                           '¿Desea iniciar la ruta de distribución?'
                       );
                   ">

                    Iniciar Ruta

                </a>

            {% endif %}


            {% if mostrar_finalizar %}

                <a href="{{ url_for(
                    'rutas.finalizar_ruta'
                ) }}"
                   class="btn btn-danger"
                   onclick="
                       return confirm(
                           '¿Desea finalizar la ruta? Todos los pedidos en ruta pasarán a ENTREGADO.'
                       );
                   ">

                    Finalizar Ruta

                </a>

            {% endif %}

        </div>


        <!-- =================================
             MAPA
        ================================== -->

        <div style="
            width:65%;
            height:420px;
            margin:20px auto;

            padding:10px;

            background:#ffffff;

            border:3px solid #cfcfcf;

            border-radius:12px;

            box-shadow:
                0 0 15px rgba(0,0,0,0.20);

            overflow:hidden;
        ">

            {{ mapa|safe }}

        </div>


        <!-- =================================
             INFORMACIÓN DE RUTA
        ================================== -->

        <div style="
            width:65%;
            margin:20px auto 0 auto;

            text-align:center;

            font-size:20px;

            font-weight:bold;
        ">

            Revendedores en Ruta:
            {{ total_revendedores }}

        </div>


        <!-- =================================
             REGRESAR
        ================================== -->

        <div class="buttons-center">

            <a href="{{ url_for(
                'dashboard'
            ) }}"
               class="btn btn-primary">

                Regresar

            </a>

        </div>

    </main>

</div>

</body>

</html>
