<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Modificar Pedido</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/styles.css') }}">

</head>

<body>

<div class="dashboard-wrapper">

    {% include 'components/header.html' %}

    <main class="content">

        <div class="page-header">

            <h1>
                Modificar Pedido
            </h1>

            <p>
                Modificación de productos y cantidades del pedido.
            </p>

        </div>

        <form method="POST">

            <!-- ==========================
                 INFORMACIÓN DEL PEDIDO
            =========================== -->

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Revendedor
                    </label>

                    <input type="text"
                           value="{{ pedido.revendedor }}"
                           readonly>

                </div>

                <div class="form-group">

                    <label>
                        Fecha del Pedido
                    </label>

                    <input type="text"
                           value="{{ pedido.fecha_pedido }}"
                           readonly>

                </div>

            </div>


            <!-- ==========================
                 PRODUCTOS
            =========================== -->

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Producto
                            </th>

                            <th>
                                Precio Unitario
                            </th>

                            <th>
                                Cantidad
                            </th>

                            <th>
                                Subtotal
                            </th>

                        </tr>

                    </thead>

                    <tbody>

                        {% for producto in productos %}

                        <tr>

                            <td>

                                {{ producto.nombre }}

                                <input type="hidden"
                                       name="id_producto[]"
                                       value="{{ producto.id_producto }}">

                            </td>

                            <td>

                                Q {{ "%.2f"|format(producto.precio) }}

                                <input type="hidden"
                                       class="precio-unitario"
                                       value="{{ producto.precio }}">

                            </td>

                            <td>

                                <input type="number"
                                       name="cantidad[]"
                                       class="cantidad-input"
                                       min="0"
                                       value="{{ producto.cantidad }}">

                            </td>

                            <td>

                                Q

                                <span class="subtotal">
                                    0.00
                                </span>

                            </td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>


            <!-- ==========================
                 TOTAL
            =========================== -->

            <div style="
                display:flex;
                justify-content:flex-end;
                margin-top:25px;
            ">

                <div style="
                    width:300px;
                ">

                    <div class="form-group">

                        <label>
                            Total del Pedido
                        </label>

                        <input type="text"
                               id="totalPedido"
                               value="Q {{ '%.2f'|format(pedido.total) }}"
                               readonly>

                    </div>

                </div>

            </div>


            <!-- ==========================
                 BOTONES
            =========================== -->

            <div class="buttons">

                <button type="submit"
                        class="btn btn-success">

                    Guardar

                </button>

                <a href="{{ url_for('pedidos.listar_pedidos') }}"
                   class="btn btn-danger">

                    Cancelar

                </a>

            </div>

        </form>

    </main>

</div>


<!-- ==========================
     JAVASCRIPT
========================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const cantidades =
            document.querySelectorAll(
                ".cantidad-input"
            );

        function calcularTotal() {

            let total = 0;

            cantidades.forEach(function(cantidadInput) {

                const fila =
                    cantidadInput.closest("tr");

                const precioElemento =
                    fila.querySelector(
                        ".precio-unitario"
                    );

                const subtotalElemento =
                    fila.querySelector(
                        ".subtotal"
                    );

                const precio =
                    parseFloat(
                        precioElemento.value
                    ) || 0;

                const cantidad =
                    parseFloat(
                        cantidadInput.value
                    ) || 0;

                const subtotal =
                    precio * cantidad;

                subtotalElemento.textContent =
                    subtotal.toFixed(2);

                total += subtotal;

            });

            document.getElementById(
                "totalPedido"
            ).value =
                "Q " + total.toFixed(2);

        }

        cantidades.forEach(function(input) {

            input.addEventListener(
                "input",
                calcularTotal
            );

            input.addEventListener(
                "change",
                calcularTotal
            );

        });

        calcularTotal();

    }
);

</script>

</body>
</html>
