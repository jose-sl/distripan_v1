<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ver Pedido</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/styles.css') }}">

</head>

<body>

<div class="dashboard-wrapper">

    {% include 'components/header.html' %}

    <main class="content">

        <div class="page-header">

            <h1>
                Información del Pedido
            </h1>

            <p>
                Consulta de productos y cantidades registradas.
            </p>

        </div>

        <!-- ==========================
             INFORMACIÓN DEL PEDIDO
        =========================== -->

        <div class="form-grid">

            <div class="form-group">

                <label>
                    Revendedor
                </label>

                <input type="text"
                       value="{{ pedido.revendedor }}"
                       readonly>

            </div>

            <div class="form-group">

                <label>
                    Fecha del Pedido
                </label>

                <input type="text"
                       value="{{ pedido.fecha_pedido }}"
                       readonly>

            </div>

        </div>


        <!-- ==========================
             PRODUCTOS
        =========================== -->

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Producto
                        </th>

                        <th>
                            Precio Unitario
                        </th>

                        <th>
                            Cantidad
                        </th>

                        <th>
                            Subtotal
                        </th>

                    </tr>

                </thead>

                <tbody>

                    {% for producto in productos %}

                    <tr>

                        <td>

                            {{ producto.nombre }}

                        </td>

                        <td>

                            Q {{ "%.2f"|format(producto.precio) }}

                            <input type="hidden"
                                   class="precio-unitario"
                                   value="{{ producto.precio }}">

                        </td>

                        <td>

                            <input type="number"
                                   class="cantidad-input"
                                   value="{{ producto.cantidad }}"
                                   readonly>

                        </td>

                        <td>

                            Q

                            <span class="subtotal">
                                0.00
                            </span>

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>


        <!-- ==========================
             TOTAL
        =========================== -->

        <div style="
            display:flex;
            justify-content:flex-end;
            margin-top:25px;
        ">

            <div style="
                width:300px;
            ">

                <div class="form-group">

                    <label>
                        Total del Pedido
                    </label>

                    <input type="text"
                           id="totalPedido"
                           value="Q {{ '%.2f'|format(pedido.total) }}"
                           readonly>

                </div>

            </div>

        </div>


        <!-- ==========================
             BOTONES
        =========================== -->

        <div class="buttons">

            <a href="{{ url_for('pedidos.listar_pedidos') }}"
               class="btn btn-primary">

                Regresar

            </a>

        </div>

    </main>

</div>


<!-- ==========================
     JAVASCRIPT
========================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const cantidades =
            document.querySelectorAll(
                ".cantidad-input"
            );

        function calcularTotal() {

            let total = 0;

            cantidades.forEach(function(cantidadInput) {

                const fila =
                    cantidadInput.closest("tr");

                const precio =
                    parseFloat(
                        fila.querySelector(
                            ".precio-unitario"
                        ).value
                    ) || 0;

                const cantidad =
                    parseFloat(
                        cantidadInput.value
                    ) || 0;

                const subtotal =
                    precio * cantidad;

                fila.querySelector(
                    ".subtotal"
                ).textContent =
                    subtotal.toFixed(2);

                total += subtotal;

            });

            document.getElementById(
                "totalPedido"
            ).value =
                "Q " + total.toFixed(2);

        }

        calcularTotal();

    }
);

</script>

</body>
</html>
