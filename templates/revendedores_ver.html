<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ver Revendedor</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/styles.css') }}">

</head>

<body>

<div class="dashboard-wrapper">

    {% include 'components/header.html' %}

    <main class="content">

        <div class="page-header">

            <h1>
                Información del Revendedor
            </h1>

            <p>
                Consulta de datos registrados del revendedor.
            </p>

        </div>

        <div class="form-grid">

            <div class="form-group">

                <label>
                    Nombre
                </label>

                <input type="text"
                       value="{{ revendedor.nombre }}"
                       readonly>

            </div>


            <div class="form-group">

                <label>
                    Teléfono
                </label>

                <input type="text"
                       value="{{ revendedor.telefono or '' }}"
                       readonly>

            </div>


            <div class="form-group">

                <label>
                    Dirección
                </label>

                <input type="text"
                       value="{{ revendedor.direccion }}"
                       readonly>

            </div>


            <div class="form-group">

                <label>
                    Zona
                </label>

                <input type="text"
                       value="{{ revendedor.zona or '' }}"
                       readonly>

            </div>


            <div class="form-group">

                <label>
                    Latitud
                </label>

                <input type="text"
                       value="{{ revendedor.latitud or '' }}"
                       readonly>

            </div>


            <div class="form-group">

                <label>
                    Longitud
                </label>

                <input type="text"
                       value="{{ revendedor.longitud or '' }}"
                       readonly>

            </div>


            <div class="form-group">

                <label>
                    Usuario Responsable
                </label>

                <input type="text"
                       value="{{ revendedor.usuario_nombre or 'Sin asignar' }}"
                       readonly>

            </div>


            <div class="form-group">

                <label>
                    Usuario
                </label>

                <input type="text"
                       value="{{ revendedor.usuario or '' }}"
                       readonly>

            </div>


            <div class="form-group">

                <label>
                    Estado
                </label>

                <input type="text"
                       value="{% if revendedor.estado %}ACTIVO{% else %}INACTIVO{% endif %}"
                       readonly>

            </div>


            <div class="form-group">

                <label>
                    Fecha de Registro
                </label>

                <input type="text"
                       value="{{ revendedor.fecha_registro }}"
                       readonly>

            </div>

        </div>


        <div class="buttons">

            <a href="{{ url_for(
                'revendedores.listar_revendedores'
            ) }}"
               class="btn btn-danger">

                Regresar

            </a>

        </div>

    </main>

</div>

</body>
</html>
