<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ver Usuario</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/styles.css') }}">
</head>

<body>

<div class="dashboard-wrapper">

    {% include 'components/header.html' %}

    <main class="content">

        <div class="page-header">
            <h1>Información del Usuario</h1>
        </div>

        <div class="form-grid">

            <div class="form-group">

                <label>Nombre</label>

                <input type="text"
                       value="{{ usuario.nombre }}"
                       readonly>

            </div>

            <div class="form-group">

                <label>Usuario</label>

                <input type="text"
                       value="{{ usuario.usuario }}"
                       readonly>

            </div>

            <div class="form-group">

                <label>Rol</label>

                <input type="text"
                       value="{{ usuario.rol }}"
                       readonly>

            </div>

            <div class="form-group">

                <label>Estado</label>

                <input type="text"
                       value="{% if usuario.estado %}ACTIVO{% else %}INACTIVO{% endif %}"
                       readonly>

            </div>

        </div>

        <div class="buttons">

            <a href="{{ url_for('usuarios.listar_usuarios') }}"
               class="btn btn-primary">

                Regresar

            </a>

        </div>

    </main>

</div>

</body>
</html>
