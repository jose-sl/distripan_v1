<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Agregar Usuario</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/styles.css') }}">
</head>

<body>

<div class="dashboard-wrapper">

    {% include 'components/header.html' %}

    <main class="content">

        <div class="page-header">
            <h1>Agregar Usuario</h1>
        </div>

        <form method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label>Nombre Completo</label>

                    <input type="text"
                           name="nombre"
                           required>
                </div>

                <div class="form-group">
                    <label>Usuario</label>

                    <input type="text"
                           name="usuario"
                           required>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>

                    <input type="password"
                           name="contrasena"
                           required>
                </div>

                <div class="form-group">
                    <label>Confirmar Contraseña</label>

                    <input type="password"
                           name="confirmar"
                           required>
                </div>

                <div class="form-group">
                    <label>Rol</label>

                    <select name="rol">

                        <option value="ADMINISTRADOR">
                            ADMINISTRADOR
                        </option>

                        <option value="SUCURSAL">
                            SUCURSAL
                        </option>

                        <option value="PRODUCCION">
                            PRODUCCION
                        </option>

                        <option value="DESPACHO">
                            DESPACHO
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Estado</label>

                    <select name="estado">

                        <option value="1">
                            Activo
                        </option>

                        <option value="0">
                            Inactivo
                        </option>

                    </select>

                </div>

            </div>

            <div class="buttons">

                <button type="submit"
                        class="btn btn-success">

                    Guardar

                </button>

                <a href="{{ url_for('usuarios.listar_usuarios') }}"
                   class="btn btn-danger">

                    Cancelar

                </a>

            </div>

        </form>

    </main>

</div>

</body>
</html>
